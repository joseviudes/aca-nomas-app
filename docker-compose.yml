# PostgreSQL local para desarrollo (D-04).
# El major (17) debe coincidir con el de Supabase.
# Puerto 5433 en tu máquina para no chocar con un PostgreSQL instalado.
# Credenciales de desarrollo: coinciden con DATABASE_URL de backend/.env.example.

# Nombre fijo del proyecto: sin esto, Docker lo saca de la carpeta del repo y cambia en cada máquina.
name: aca-nomas

services:
  db:
    image: postgres:17
    container_name: aca-nomas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aca_nomas
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aca_nomas']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
