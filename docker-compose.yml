# Entorno de DESARROLLO con perfiles (D-26, D-33). Se elige qué levantar:
#   docker compose up -d                        solo la base de datos
#   docker compose --profile api up --watch     la base y la API
#   docker compose --profile full up --watch    todo: base, API, web y panel
# Los perfiles se combinan: `--profile api --profile panel` levanta la base, la API y el panel.
# Con --watch, cada archivo guardado se copia al contenedor y el servidor se recarga.
#
# PostgreSQL: el major (17) debe coincidir con el de Supabase (D-04). Puerto 5433 en tu máquina
# para no chocar con un PostgreSQL instalado (D-24). Credenciales de desarrollo: coinciden con
# DATABASE_URL de backend/.env.example.

# Nombre fijo del proyecto: sin esto, Docker lo saca de la carpeta del repo y cambia en cada máquina.
name: aca-nomas

services:
  db:
    image: postgres:17
    container_name: aca-nomas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aca_nomas
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aca_nomas']
      interval: 5s
      timeout: 3s
      retries: 10

  # API en modo desarrollo. Al arrancar aplica las migraciones pendientes y corre `npm run dev`.
  api:
    profiles: [api, full]
    build: ./backend
    container_name: aca-nomas-api
    environment:
      # Dentro de Docker la base se llama "db" y escucha en 5432, no en localhost:5433.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aca_nomas
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    # Compose Watch: copia al contenedor cada archivo que se guarda, y `tsx watch` reinicia el
    # servidor. Funciona igual en Windows, Mac y Linux (montar la carpeta no avisa los cambios en
    # Windows). Si cambian las dependencias o el schema, reconstruye la imagen.
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - generated/
        - action: sync
          path: ./backend/tests
          target: /app/tests
        - action: rebuild
          path: ./backend/package-lock.json
        - action: rebuild
          path: ./backend/prisma
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  # Web pública (Next.js) en modo desarrollo. No depende de la API para arrancar: se puede
  # levantar sola con `--profile web` y apuntar a una API que corra con `npm run dev`.
  web:
    profiles: [web, full]
    build: ./web
    container_name: aca-nomas-web
    environment:
      # El navegador está en tu máquina: llega a la API por localhost:3000.
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      # El servidor de Next está dentro de Docker: ahí `localhost` es este contenedor y la API se
      # llama "api". Si la API corre con `npm run dev` en tu máquina, usar host.docker.internal.
      API_INTERNAL_URL: http://api:3000/api
    ports:
      - '3001:3001'
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/tests
          target: /app/tests
        - action: sync+restart
          path: ./web/next.config.ts
          target: /app/next.config.ts
        - action: rebuild
          path: ./web/package-lock.json
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # La primera compilación de Next tarda: no cuenta como falla durante el primer minuto.
      start_period: 60s

  # Panel del dueño (Vite + React) en modo desarrollo. Corre solo en el navegador, así que le
  # alcanza con la URL pública de la API.
  panel:
    profiles: [panel, full]
    build: ./panel
    container_name: aca-nomas-panel
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - '3002:3002'
    develop:
      watch:
        - action: sync
          path: ./panel/src
          target: /app/src
        - action: sync
          path: ./panel/tests
          target: /app/tests
        - action: sync
          path: ./panel/public
          target: /app/public
        - action: sync+restart
          path: ./panel/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./panel/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./panel/package-lock.json
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
